<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CrystalToolBox 是面向纳米材料、晶体学与电子显微分析的教学与科研辅助工具：XRD/光谱数据预处理与 Jade 导出、DIF 转 XY、倒易空间与晶向计算、SAED 与 XRD 模拟。"
    />
    <meta name="theme-color" content="#1b4575" />
    <title>CrystalToolBox · 纳米材料与晶体学工具箱</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ctb.theme.v2')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          if (t === 'dark') document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
